<!DOCTYPE HTML>
<html lang = "en">
    <head>
        <meta charset = "UTF-8" >
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hotel Room Booking Form</title>
    </head>

    <body>
        <main>
            <h1 align = "center">Hotel Room Booking Form</h1>
            <form action ="#" method = "post" align ="center">
                <!--Full Name-->
                <label for = "fullname">Full Name:</label>
                <input type = "text" id = "fullname" name = fullname" required >
                <br><br>

                <!--Email-->
                <label for = "email">Email:</label>
                <input type = "email" id = "email" name = "email"  required>
                <br><br>

                <!--Phone-->
                <label for = "phone">Phone:</label>
                <input type = "number" id = "phone" name = "phone"  required>
                <br><br>

                <!--Check-in Date-->
                <label for = "check-in-date">Check-in Date:</label>
                <input type = "date" id ="check-in-date" name = "check-in-date" required>
                <br><br>

                <!--Check-out-Date-->
                <label for = "check-out-date">Check-out Date:</label>
                <input type = "date" id ="check-out-date" name = "check-out-date" required>
                <br><br>

                <!--Room Type-->
                <label for = "room-type">Room Type:</label>
                <select id = "room-type" name = "room-type" required>
                    <option value = "single">Single</option>
                    <option value = "double">Double</option>
                    <option value = "suite">Suite</option>
                </select>
                <br><br>

                <!--Number of Guests-->
                <label for = "number-of-guests">Number of Guests:</label>
                <input type = "number" id = "number-of-guests" name = "number-of-guests" min="2" max="10" required>
                <br><br>

                <!--Special Requests(Textarea)-->
                <label for = "special-requests">Special Requests:</label>
                <br>
                <textarea row="10" cols="30" id = "special-requests" name = "special-requests"></textarea>
                <br><br>

                <!--Submit and Reset-->
                <button type = "submit">Book Now</button>
                <button type = "reset">Reset Form</button>


            </form>
        </main>
    </body>
</html>
