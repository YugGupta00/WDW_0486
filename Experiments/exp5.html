<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Registration Form</title>
    </head>

    <body>
        <main>
            <h1 align = "center">Student Registration Form</h1>
            <form action = "submit.html" method = "post">
              <hr>
              <!--Full Name-->  
              <label for = "fullname">Full Name: </label>
              <input type = "text" name = "fullname" id = "fullname" placeholder = "Enter your full name" required>
              <br><br>

              <!--Email-->
              <label for = "email">Email: </label>
              <input type = "email" name = "email" id = "email" placeholder = "Enter valid email address" required>
              <br><br>

              <!---Password-->
              <label for = "password">Password: </label>
              <input type = "password" name = "password" id = "password" placeholder = "Enter password" required>
              <br><br>

              <!--Gender-->
              <label for = "gender">Gender:</label>

              <input type = "radio" id = "male" name = "gender" value = "male">
              <label for = "male">Male</label> 

              <input type = "radio" id = "female" name = "gender" value = "female">
              <label for = "female">Female</label>

              <input type = "radio" id = "other" name = "gender" value = "other">
              <label for = "other">Other</label>

              <br><br>

              <!--Course-->
              <label for = "course">Course: </label>
              <select name ="course" id = "course" >
                <option value = "B.Tech">B.Tech</option>
                <option value = "M.Tech">M.tech</option>
                <option value = "B.B.A">B.B.A</option>
              </select>
              <br><br>

              <!--Contact No.-->
              <label for = "contact-no">Contact No.:</label>
              <input type = "number" id = "contact-no" name = "contact-no" placeholder = "Enter phone number" required>
              <br><br>

              <!--Address-->
              <label for = "address">Address:</label><br>
              <textarea row = "4" cols = "40" id = "address" name = "address" placeholder = "Enter your address"></textarea>
              <br><br>

              <!--Submit and Reset-->
              <button type = "submit" value = "register">Register</button>
              <button type = "reset" value = "clear">Clear</button>

            </form>

            <hr>
            <p align = "center">&copy; 2025 Student Registration Portal</p>
        </main>
    </body>
</html>
