<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select, Textarea and Buttons</title>
</head>
<body>
    <label for = "courses">Courses: </label>
    <select type = "dropdown" id = "courses">
        <option value = "ece">ECE</option>
        <option value = "ece">Mechanical</option>
        <option value = "ece">Electrical</option>
        <option value = "ece">CSE</option>
        <option value = "ece">CSE (AIML)</option>
    </select>
    <br><br>

    <label for = "feedback" >Feedback: </label>
    <br>
    <textarea rows = "10" cols = "40" id = "feedback" placeholder = "Write here...."></textarea>

    <br><br>

    <button type = "submit">Submit</button>
    <button type = "reset">Reset</button>
    <button type = "click me">Click Me</button>
</body>
</html>
