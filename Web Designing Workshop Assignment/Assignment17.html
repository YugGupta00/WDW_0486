<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Attributes and Input Validation</title>
</head>
<body>
   <form>
     <input type = "text" id = "name" placeholder = "Full name" required><br><br>
    <input type = "email" id = "email" placeholder = "you@college.edu" required><br><br>
    <input type = "number" id = "mobile_number" placeholder = "10-digit mobile" minlength = "10" maxlength = "10" required><br><br>
    <input type = "password" id = "password" placeholder = "Min 6 characters" minlength = "6" required><br><br>
    <input type = "number" id = "age" placeholder = "Age(1)" min = "1" max = "30" required><br><br>

    <button type = "submit">Register</button>
   </form>
</body>
</html>
