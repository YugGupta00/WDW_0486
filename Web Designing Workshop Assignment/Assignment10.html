<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia: Image, Video, Audio and YouTube</title>
</head>
<body>

    <p>College campus</p>

</html>
