<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>freeCodeCamp Survey Form</title>
  </head>

  <body>
    <h1 id ="title">freeCodeCamp Survey Form</h1>
    <p id = "description">Thank you taking the time to help us improve the platform</p>

    <form id = "survey-form" method = "post">
      <label for = "name" id = "name-label">Name </label>
      <input type = "text" 
      id = "name" placeholder = "Enter your name" name = "name" required><br>

      <label for = "email" id = "email-label">Email </label>
      <input type = "email" id = "email" name = "email" placeholder = "Enter your Email" required ><br>

      <label for = "number" id = "number-label">Age(optional)</label>
      <input type = "number" id = "number" name = "age" placeholder = "Age" min = "8" max = "70" required value = "age">

      <br><br>

      <p>Which option best describes your current role?</p>
      <label for = "dropdown"></label>
      <select id = "dropdown" name = "role">
        <option value = "" disabled selected>Select current role</option>
        <option value = "working-professional">Working Professional</option>
        <option value = "student">Student</option>
      </select>

      <p>Would you recommend freeCodecamp to a friend?</p>
      <label for ="recommendation"</label>
      <input type = "radio" id = "definitely" selected value ="definitely" name = "recommendation">
      <label for = "definitely">Definitely</label>

      <input type = "radio" id = "maybe" value = "maybe" name = "recommendation">
      <label for = "maybe">Maybe</label>

      <input type = "radio" id = "not-sure" value = "not-sure" name = "recommendation">
      <label for = "not-sure">Not sure</label>

      <p>What is your favorite feature of freeCodeCamp?</p>

      <label for = "feature"></label>
      <select>
        <option value = "" disabled selected>Select an option</option>
        <option value = "quiz">Quiz</option>
        <option value = "interactive-editor">Interactive Editor</option>
      </select>

      <p>What would you like to see improved? (Check all that apply)</p>

      <input type = checkbox id = "front-end-projects" value = "front-end-projects">
      <label for = "front-end-projects">Front-end Projects</label>

      <input type = checkbox id = "back-end-projects" value = "back-end-projects">
      <label for = "back-end-projects">Back-end Projects</label>
     
      <input type = checkbox id = "data-visualization" value = "data-visualization">
      <label for = "data-visualisation">Data Visualization</label>
      
      <input type = checkbox id = "challenge" value = "challenge">
      <label for = "challenge">Challenge</label>
     
      <input type = checkbox id = "open-source-community" value = "open-source-community">
      <label for = "open-source-community">Open Source Community</label>
      
      <input type = checkbox id = "gitter-help-rooms" value = "gitter-help-rooms">
      <label for = "gitter-help-rooms">Gitter help Rooms</label>
      
      <input type = checkbox id = "videos" value = "videos">
      <label for = "videos">Videos</label>
      
      <input type = checkbox id = "city-meetups" value = "city-meetups">
      <label for = "city-meetups">City Meetups</label>
      
      <input type = checkbox id = "wiki" value = "wiki">
      <label for = "wiki">Wiki</label>
      
      <input type = checkbox id = "forum" value = "forum">
      <label for = "forum">Forum</label>
      
      <input type = checkbox id = "additional-couses" value = "additional-couses">
      <label for = "additional-couses">Additional Couses</label>

      <p>Any comments or suggestions?</p>
      <br>
      <textarea rows = "10" cols = "30" placeholder = "Enter your comment here.. "></textarea><br>
      <button type = "submit" id = "submit">Submit</button>
      

    </form>
  </body>
</html>
